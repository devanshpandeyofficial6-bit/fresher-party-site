      min-height: 100vh;

    /* Keyframe Animations */
    @keyframes partyFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes auraPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    @keyframes barDance {
      0%, 100% { height: 4px; }
      50% { height: 18px; }
    }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* DJ Sound Wave & Audio Spectrum Visualizer Effect */
    .dj-soundwave-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      max-width: 1050px;
      max-height: 480px;
      pointer-events: none;
      z-index: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Radial DJ Sound Pressure Waves */
    .dj-sonic-ring {
      position: absolute;
      border-radius: 9999px;
      border: 2px solid rgba(236, 72, 153, 0.45);
      box-shadow: 0 0 35px rgba(168, 85, 247, 0.35), inset 0 0 20px rgba(6, 182, 212, 0.25);
      animation: djSonicPulse 3.8s cubic-bezier(0.1, 0.7, 0.3, 1) infinite;
      opacity: 0;
      will-change: transform, opacity;
    }
    .dj-sonic-ring:nth-child(1) { animation-delay: 0s; }
    .dj-sonic-ring:nth-child(2) { animation-delay: 0.95s; border-color: rgba(6, 182, 212, 0.5); }
    .dj-sonic-ring:nth-child(3) { animation-delay: 1.9s; border-color: rgba(168, 85, 247, 0.45); }
    .dj-sonic-ring:nth-child(4) { animation-delay: 2.85s; border-color: rgba(245, 158, 11, 0.4); }

    @keyframes djSonicPulse {
      0% {
        width: 60px;
        height: 60px;
        opacity: 0.9;
        transform: scale(0.5);
      }
      50% {
        opacity: 0.55;
      }
      100% {
        width: 100%;
        height: 100%;
        opacity: 0;
        transform: scale(1.15);
      }
    }

    /* DJ Stereo Equalizer Wave Spectrum */
    .dj-spectrum-bar-wrap {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 92%;
      max-width: 980px;
      height: 150px;

      filter: drop-shadow(0 0 14px rgba(236, 72, 153, 0.45));

      max-width: 6px;
      height: 20px;
      border-radius: 9999px;
      background: linear-gradient(to top, #ec4899 0%, #a855f7 50%, #06b6d4 100%);
      animation: djWaveform 1.1s ease-in-out infinite alternate;

    .dj-spectrum-bar:nth-child(odd) {
      background: linear-gradient(to top, #8b5cf6 0%, #ec4899 50%, #f59e0b 100%);

        height: 10px;

        opacity: 0.85;
      }

  <!-- Main React App (Using Babel JSX) -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useLayoutEffect, useCallback } = React;

    // ============================================================
    // 3D MOTION SYSTEM: Interactive Three.js WebGL Particle & Geometry Scene
    // ============================================================
    function ThreeDBackground() {
      const mountRef = useRef(null);

      useEffect(() => {
        if (typeof THREE === "undefined" || !mountRef.current) return;

        const container = mountRef.current;
        let width = window.innerWidth;
        let height = window.innerHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
        camera.position.z = 28;

        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
        } catch (e) {
          console.warn("WebGL not supported for 3D background", e);
          return;
        }

        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Group for floating 3D party geometries
        const group = new THREE.Group();
        scene.add(group);

        const geometries = [
          new THREE.IcosahedronGeometry(1.6, 0),
          new THREE.OctahedronGeometry(1.3, 0),
          new THREE.TetrahedronGeometry(1.4, 0),
          new THREE.TorusGeometry(2.2, 0.35, 16, 60),
          new THREE.DodecahedronGeometry(1.5, 0)
        ];

        const colors = [0xec4899, 0xa855f7, 0xf59e0b, 0x06b6d4, 0x8b5cf6, 0xf43f5e];

        const meshes = [];
        // Create 15 floating 3D festive geometries
        for (let i = 0; i < 15; i++) {
          const geom = geometries[i % geometries.length];
          const color = colors[i % colors.length];

          const mat = new THREE.MeshBasicMaterial({
            color: color,
            wireframe: true,
            transparent: true,
            opacity: 0.32
          });

          const mesh = new THREE.Mesh(geom, mat);
          mesh.position.x = (Math.random() - 0.5) * 50;
          mesh.position.y = (Math.random() - 0.5) * 40;
          mesh.position.z = (Math.random() - 0.5) * 30;

          mesh.rotSpeedX = (Math.random() - 0.5) * 0.014;
          mesh.rotSpeedY = (Math.random() - 0.5) * 0.018;
          mesh.initY = mesh.position.y;
          mesh.floatOffset = Math.random() * Math.PI * 2;

          group.add(mesh);
          meshes.push(mesh);
        }

        // 3D Particle Starfield / Floating Glitter
        const particleCount = 220;
        const starGeom = new THREE.BufferGeometry();
        const starPositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
          starPositions[i] = (Math.random() - 0.5) * 65;
          starPositions[i + 1] = (Math.random() - 0.5) * 55;
          starPositions[i + 2] = (Math.random() - 0.5) * 45;
        }

        starGeom.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
        const starMat = new THREE.PointsMaterial({
          color: 0xf472b6,
          size: 0.4,
          transparent: true,
          opacity: 0.7
        });

        const starField = new THREE.Points(starGeom, starMat);
        scene.add(starField);

        // Smooth Mouse Parallax
        let mouseX = 0;
        let mouseY = 0;
        let targetX = 0;
        let targetY = 0;

        const onMouseMove = (e) => {
          mouseX = (e.clientX - width / 2) * 0.0006;
          mouseY = (e.clientY - height / 2) * 0.0006;
        };

        window.addEventListener("mousemove", onMouseMove, { passive: true });

        const onResize = () => {
          width = window.innerWidth;
          height = window.innerHeight;
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height);
        };
        window.addEventListener("resize", onResize);

        let reqId;
        let clock = new THREE.Clock();

        const animate = () => {
          reqId = requestAnimationFrame(animate);
          const t = clock.getElapsedTime();

          targetX += (mouseX - targetX) * 0.05;
          targetY += (mouseY - targetY) * 0.05;

          camera.position.x = targetX * 10;
          camera.position.y = -targetY * 8;
          camera.lookAt(scene.position);

          meshes.forEach((m, idx) => {
            m.rotation.x += m.rotSpeedX;
            m.rotation.y += m.rotSpeedY;
            m.position.y = m.initY + Math.sin(t * 1.4 + m.floatOffset) * 1.2;
          });

          starField.rotation.y = t * 0.015;
          group.rotation.y = t * 0.025;

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(reqId);
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("resize", onResize);
          if (renderer && renderer.domElement && container.contains(renderer.domElement)) {
            container.removeChild(renderer.domElement);
          }
          renderer.dispose();
        };
      }, []);

      return (
        <div
          ref={mountRef}
          className="fixed inset-0 pointer-events-none z-0 overflow-hidden"
          aria-hidden="true"
        ></div>
      );
    }

    // ============================================================
    // 3D MOTION SYSTEM: Interactive Perspective Tilt Card Component
    // ============================================================
    function TiltCard({ children, className = "", maxTilt = 8, scale = 1.02, ...props }) {
      const [tilt, setTilt] = useState({ rx: 0, ry: 0, s: 1 });
      const cardRef = useRef(null);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        setTilt({ rx: -y * maxTilt, ry: x * maxTilt, s: scale });
      };

      const handleMouseLeave = () => {
        setTilt({ rx: 0, ry: 0, s: 1 });
      };

      return (
        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `perspective(1000px) rotateX(${tilt.rx}deg) rotateY(${tilt.ry}deg) scale3d(${tilt.s}, ${tilt.s}, ${tilt.s})`,
            transition: tilt.s === 1 ? "transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1)" : "transform 0.08s ease-out",
            transformStyle: "preserve-3d"
          }}
          className={className}
          {...props}
        >
          {children}
        </div>
      );
    }

          <div className="absolute w-80 h-40 bg-gradient-to-r from-pink-500/20 via-purple-500/25 to-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    // Helper: Detect Device Info for Dashboard Tracking
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let os = "Desktop";
      if (/Android/i.test(ua)) os = "Android 📱";
      else if (/iPhone|iPad|iPod/i.test(ua)) os = "iOS 📱";
      else if (/Mac/i.test(ua)) os = "macOS 💻";
      else if (/Windows/i.test(ua)) os = "Windows 💻";
      else if (/Linux/i.test(ua)) os = "Linux 💻";

      let browser = "Browser";
      if (/Chrome/i.test(ua) && !/Edge|Edg/i.test(ua)) browser = "Chrome";
      else if (/Safari/i.test(ua) && !/Chrome/i.test(ua)) browser = "Safari";
      else if (/Firefox/i.test(ua)) browser = "Firefox";
      else if (/Edge|Edg/i.test(ua)) browser = "Edge";

      return `${os} (${browser})`;
    }

    function Ed({ v, on, cls = "", ph = "Type here...", label, set }) {
      const r = useRef();
      useLayoutEffect(() => {
        const el = r.current;
        if (el && document.activeElement !== el) el.textContent = v || "";
      }, [v]);

      return (
        <span
          ref={r}
          contentEditable={on}
          suppressContentEditableWarning={true}
          data-ph={ph}
          className={cls + (on ? " edt" : "")}
          onBlur={e => {
            const text = e.currentTarget.textContent.trim();
            if (text !== v) set(text, label, v);
          }}
          onKeyDown={e => {
            if (e.key === "Enter") {
              e.preventDefault();
              e.currentTarget.blur();
            }
          }}
        />
      );
    }

            }
            if (remote.members) {
              const cleanMem = sanitizeMembers(remote.members);
              setMembers(cleanMem);
              localStorage.setItem("fresher_committee_members_v4", JSON.stringify(cleanMem));
            }
            setCloudStatus("server");
            setLastSyncTime(new Date());
            setIsSyncing(false);
            return;
          }
        } catch (e) {
          // Fall through to local storage
        }

        // Tier 3: Local Storage mode
        setCloudStatus("local");
        setLastSyncTime(new Date());
        setIsSyncing(false);
      }, [firebaseUrl, isSyncing]);

      // Push a registered/updated user to cloud backend
      const pushUserToCloud = async (userObj) => {
        const customUrl = firebaseUrl || localStorage.getItem("fresher_firebase_url") || DEFAULT_FIREBASE_URL;
        if (customUrl) {
          try {
            const cleanUrl = customUrl.replace(/\/$/, "");
            const key = userObj.email.replace(/[^a-zA-Z0-9]/g, "_");
            await fetch(`${cleanUrl}/portal_state/users/${key}.json`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(userObj)
            });
          } catch (e) {}
        }

        // Try server as well
        try {
          await fetch("/api/auth/signup", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(userObj)
          });
        } catch (e) {}
        return true;
      };

      // Push all data state changes to cloud
      const pushStateToCloud = async (updatedData, updatedMembers, updatedUsers) => {
        const customUrl = firebaseUrl || localStorage.getItem("fresher_firebase_url") || DEFAULT_FIREBASE_URL;
        if (customUrl) {
          try {
            const cleanUrl = customUrl.replace(/\/$/, "");
            if (updatedData) {
              await fetch(`${cleanUrl}/portal_state/itinerary.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedData)
              });
            }
            if (updatedMembers) {
              await fetch(`${cleanUrl}/portal_state/members.json`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(updatedMembers)
              });
            }
          } catch (e) {}
        }

        // Try Server as well
        try {
          if (updatedData) {
            await fetch("/api/itinerary", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ itinerary: updatedData })
            });
          }
          if (updatedMembers) {
            await fetch("/api/members", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ members: updatedMembers })
            });
          }
        } catch (e) {}
      };

      // Periodic Auto-Sync Every 6 seconds for multi-device live refresh
      useEffect(() => {
        syncWithCloud(true);
        const timer = setInterval(() => {
          syncWithCloud(false);
        }, 6000);
        return () => clearInterval(timer);
      }, [syncWithCloud]);

      // Countdown Timer
      useEffect(() => {
        const updateCountdown = () => {
          const target = new Date(data.targetDate || "2026-10-16T10:00").getTime();
          const now = Date.now();
          const diff = Math.max(0, target - now);

          setTimeLeft({
            days: Math.floor(diff / (1000 * 60 * 60 * 24)),
            hours: Math.floor((diff / (1000 * 60 * 60)) % 24),
            mins: Math.floor((diff / 1000 / 60) % 60),
            secs: Math.floor((diff / 1000) % 60)
          });
        };
        updateCountdown();
        const interval = setInterval(updateCountdown, 1000);
        return () => clearInterval(interval);
      }, [data.targetDate]);

      // Update Itinerary
      const updateData = (updater, logMsg) => {
        setData(prev => {
          const next = typeof updater === "function" ? updater(JSON.parse(JSON.stringify(prev))) : updater;
          localStorage.setItem("fresher_party_data_v9", JSON.stringify(next));
          pushStateToCloud(next, null, null);
          return next;
        });
        if (logMsg) notify(logMsg);
      };

      // Update Committee Members
      const updateMembers = (updater, logMsg) => {
        setMembers(prev => {
          const next = typeof updater === "function" ? updater(JSON.parse(JSON.stringify(prev))) : updater;
          localStorage.setItem("fresher_committee_members_v4", JSON.stringify(next));
          pushStateToCloud(null, next, null);
          return next;
        });
        if (logMsg) notify(logMsg);
      };

      // Handle Authentication: Instant Log-in on Sign Up & Cloud Push
      const handleAuth = async (e) => {
        e.preventDefault();
        setAuthError("");
        const email = authEmail.trim().toLowerCase();
        const pass = authPass;
        const currentDevice = getDeviceInfo();

        if (!email || !pass) {
          setAuthError("Please fill in both email and password.");
          return;
        }

        let updatedUsers = [...users];

        if (isSignup) {
          if (updatedUsers.some(u => u.email.toLowerCase() === email)) {
            setAuthError("An account with this email already exists. Please switch to Log In.");
            return;
          }

          const isMaster = email === ADMIN_EMAIL.toLowerCase();
          const newUser = {
            id: "user-" + Date.now(),
            email: email,
            name: authName.trim() || email.split("@")[0],
            password: pass,
            role: isMaster ? "admin" : "viewer",
            canEdit: isMaster,
            registeredAt: new Date().toISOString(),
            lastLoginAt: new Date().toISOString(),
            device: currentDevice
          };

          updatedUsers.push(newUser);
          setUsers(updatedUsers);
          localStorage.setItem("fresher_party_users_v2", JSON.stringify(updatedUsers));

          // Log in the user immediately
          setCurrentUser(newUser);
          localStorage.setItem("fresher_active_session", JSON.stringify(newUser));
          setAuthModalOpen(false);

          // Push user details to cloud database
          await pushUserToCloud(newUser);

          notify(`🎉 Welcome ${newUser.name}! You are now logged in from ${currentDevice}.`);
          triggerConfetti();
        } else {
          // Login Flow
          const found = updatedUsers.find(u => u.email.toLowerCase() === email && u.password === pass);
          if (!found) {
            setAuthError("Invalid email or password. Please check your credentials.");
            return;
          }

          found.lastLoginAt = new Date().toISOString();
          found.device = currentDevice;
          setUsers([...updatedUsers]);
          localStorage.setItem("fresher_party_users_v2", JSON.stringify(updatedUsers));

          setCurrentUser(found);
          localStorage.setItem("fresher_active_session", JSON.stringify(found));
          setAuthModalOpen(false);

          await pushUserToCloud(found);

          notify(`👋 Welcome back, ${found.name || found.email}!`);
          if (found.role === "admin") triggerConfetti();
        }
      };

      const handleLogout = () => {
        setCurrentUser(null);
        setEditMode(false);
        setActiveTab("home");
        localStorage.removeItem("fresher_active_session");
        notify("Logged out successfully.");
      };

      // Toggle user edit permissions & push live to cloud
      const toggleUserEditRights = async (userEmail, allow) => {
        const next = users.map(u => {
          if (u.email.toLowerCase() === userEmail.toLowerCase()) {
            return { ...u, canEdit: allow, role: allow ? "editor" : "viewer" };
          }
          return u;
        });
        setUsers(next);
        localStorage.setItem("fresher_party_users_v2", JSON.stringify(next));

        const updatedTarget = next.find(u => u.email.toLowerCase() === userEmail.toLowerCase());
        if (updatedTarget) {
          await pushUserToCloud(updatedTarget);
        }

        if (currentUser && currentUser.email.toLowerCase() === userEmail.toLowerCase()) {
          const updatedSelf = { ...currentUser, canEdit: allow, role: allow ? "editor" : "viewer" };
          setCurrentUser(updatedSelf);
          localStorage.setItem("fresher_active_session", JSON.stringify(updatedSelf));
        }

        // Try API endpoint
        try {
          await fetch(`/api/users/${encodeURIComponent(userEmail)}/rights`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ canEdit: allow })
          });
        } catch (e) {}

        notify(`Editing rights for ${userEmail}: ${allow ? "GRANTED (Active)" : "REVOKED (Viewer)"}`);
      };

      // Delete User
      const deleteUser = async (userEmail) => {
        if (userEmail.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          alert("Cannot delete the Super Admin account.");
          return;
        }
        if (!confirm(`Are you sure you want to remove user "${userEmail}" from the registry?`)) return;

        const next = users.filter(u => u.email.toLowerCase() !== userEmail.toLowerCase());
        setUsers(next);
        localStorage.setItem("fresher_party_users_v2", JSON.stringify(next));

        // Delete from Server
        try {
          await fetch(`/api/users/${encodeURIComponent(userEmail)}`, { method: "DELETE" });
        } catch (e) {}

        // Delete from Firebase
        const customUrl = firebaseUrl || localStorage.getItem("fresher_firebase_url");
        if (customUrl) {
          try {
            const cleanUrl = customUrl.replace(/\/$/, "");
            const key = userEmail.replace(/[^a-zA-Z0-9]/g, "_");
            await fetch(`${cleanUrl}/portal_state/users/${key}.json`, { method: "DELETE" });
          } catch (e) {}
        }

        notify(`User ${userEmail} removed.`);
      };

      // Export Attendees to CSV
      const exportAttendeesCSV = () => {
        const headers = ["Name", "Email", "Role", "Can Edit", "Registered At", "Last Login", "Device Info"];
        const rows = users.map(u => [
          `"${u.name || ''}"`,
          `"${u.email}"`,
          `"${u.role || 'viewer'}"`,
          `"${u.canEdit ? 'YES' : 'NO'}"`,
          `"${u.registeredAt || ''}"`,
          `"${u.lastLoginAt || ''}"`,
          `"${u.device || 'Web'}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `freshers2026_registered_users_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        notify("📥 Registered attendees list exported as CSV!");
      };

      // Copy All Emails
      const copyAllEmails = () => {
        const emailList = users.map(u => u.email).join(", ");
        navigator.clipboard.writeText(emailList);
        notify("📋 Copied all " + users.length + " user emails to clipboard!");
      };

      // Schedule Row Actions
      const moveRow = (idx, dir) => {
        const target = idx + dir;
        if (target < 0 || target >= data.rows.length) return;
        updateData(d => {
          const temp = d.rows[idx];
          d.rows[idx] = d.rows[target];
          d.rows[target] = temp;
          return d;
        }, "Schedule row reordered.");
      };

      const removeRow = (idx) => {
        const itemTitle = data.rows[idx]?.title || "this row";
        if (!confirm(`Are you sure you want to remove "${itemTitle}" from the itinerary?`)) return;
        
        updateData(d => {
          d.rows.splice(idx, 1);
          return d;
        }, `Removed "${itemTitle}".`);
      };

      const duplicateRow = (idx) => {
        updateData(d => {
          d.rows.splice(idx + 1, 0, { ...d.rows[idx] });
          return d;
        }, "Row duplicated.");
      };

      const handleCreateRow = (e) => {
        e.preventDefault();
        const title = newRowTitle.trim() || (TYPES_MAP[newRowType] || "New Item");
        const who = newRowWho.trim() || "To be announced";
        const min = newRowMin.trim() || "";

        const newRowObj = { type: newRowType, title, who, min };

        updateData(d => {
          if (insertPosition === "top") {
            d.rows.unshift(newRowObj);
          } else if (insertPosition === "bottom") {
            d.rows.push(newRowObj);
          } else {
            const pos = parseInt(insertPosition, 10);
            d.rows.splice(isNaN(pos) ? d.rows.length : pos + 1, 0, newRowObj);
          }
          return d;
        }, `Added new ${TYPES_MAP[newRowType]} to schedule!`);

        setNewRowTitle("");
        setNewRowWho("");
        setNewRowMin("3 MIN");
        setIsAddingRow(false);
      };

      // Member Management Actions
      const handleCreateMember = (e) => {
        e.preventDefault();
        const dept = newMemberDept === "__custom__" ? newMemberCustomDept.trim() : newMemberDept;
        if (!dept) {
          alert("Please specify a department name.");
          return;
        }

        const newMember = {
          id: "mem-" + Date.now(),
          department: dept,
          role: newMemberRole.trim() || "Member",
          name: newMemberName.trim(),
          rollNo: newMemberRoll.trim() || "NOT FOUND"
        };

        updateMembers(m => {
          m.push(newMember);
          return m;
        }, `Added ${newMember.name} to ${dept}!`);

        setNewMemberName("");
        setNewMemberRoll("");
        setIsAddingMember(false);
      };

      const removeMember = (id, name) => {
        if (!confirm(`Are you sure you want to remove "${name}" from the committee roster?`)) return;
        updateMembers(m => m.filter(item => item.id !== id), `Removed ${name} from roster.`);
      };

      const editMemberField = (id, field, value) => {
        updateMembers(m => {
          const found = m.find(item => item.id === id);
          if (found) found[field] = value;
          return m;
        }, `Updated member details.`);
      };

      const resetToDefault = () => {
        if (!confirm("Are you sure you want to reset the itinerary to the official Freshers 2026 sequence?")) return;
        updateData(DEFAULT_DATA, "Reset to official itinerary sequence.");
      };

      const resetMembersToDefault = () => {
        if (!confirm("Are you sure you want to reset all department members to original roster?")) return;
        updateMembers(DEFAULT_MEMBERS, "Reset committee members to default list.");
      };

      const editEnabled = editMode && hasEditPermission;

      // Group members by department
      const allDepartments = Array.from(new Set([...DEFAULT_DEPARTMENTS, ...members.map(m => m.department)]));

      const filteredMembers = members.filter(m => {
        const matchesDept = selectedDeptFilter === "all" || m.department === selectedDeptFilter;
        const query = memberSearchQuery.toLowerCase();
        const matchesSearch = m.name.toLowerCase().includes(query) || 
                              m.rollNo.toLowerCase().includes(query) || 
                              m.role.toLowerCase().includes(query) ||
                              m.department.toLowerCase().includes(query);
        return matchesDept && matchesSearch;
      });

      const filteredScheduleRows = data.rows.map((row, idx) => ({ ...row, originalIndex: idx })).filter(row => {
        if (selectedCategoryFilter === "all") return true;
        return row.type === selectedCategoryFilter;
      });

      const filteredUsers = users.filter(u => 
        u.email.toLowerCase().includes(searchQuery.toLowerCase()) || 
        (u.name && u.name.toLowerCase().includes(searchQuery.toLowerCase())) ||
        (u.device && u.device.toLowerCase().includes(searchQuery.toLowerCase()))
      );

      const getCategoryBadge = (type) => {
        const cat = ROW_CATEGORIES.find(c => c.id === type);
        return cat ? cat.badge : "bg-slate-700/50 text-slate-200 border-slate-600";
      };

      const getLeadBadgeStyle = (role, dept) => {
        const r = (role || "").toLowerCase();
        const d = (dept || "").toLowerCase();
        const isLead = r.includes("lead") || r.includes("head") || r.includes("anchor") || r.includes("composer");
        if (!isLead) return "bg-purple-500/20 text-purple-200 border-purple-400/30";

        if (r.includes("management") || d.includes("disciplinary") || d.includes("management")) {
          return "bg-gradient-to-r from-amber-500/30 to-orange-500/30 text-amber-300 border-amber-400/60 shadow-sm shadow-amber-500/20";
        }
        if (d.includes("rampwalk")) {
          return "bg-gradient-to-r from-rose-500/30 to-pink-500/30 text-pink-300 border-pink-400/60 shadow-sm shadow-pink-500/20";
        }
        if (d.includes("art") || d.includes("craft")) {
          return "bg-gradient-to-r from-emerald-500/30 to-teal-500/30 text-emerald-300 border-emerald-400/60 shadow-sm shadow-emerald-500/20";
        }
        if (d.includes("anchors")) {
          return "bg-gradient-to-r from-cyan-500/30 to-blue-500/30 text-cyan-300 border-cyan-400/60 shadow-sm shadow-cyan-500/20";
        }
        if (d.includes("technical")) {
          return "bg-gradient-to-r from-indigo-500/30 to-purple-500/30 text-indigo-300 border-indigo-400/60 shadow-sm shadow-indigo-500/20";
        }
        if (d.includes("sound")) {
          return "bg-gradient-to-r from-fuchsia-500/30 to-violet-500/30 text-fuchsia-300 border-fuchsia-400/60 shadow-sm shadow-fuchsia-500/20";
        }
        if (d.includes("video") || d.includes("photo")) {
          return "bg-gradient-to-r from-sky-500/30 to-blue-600/30 text-sky-300 border-sky-400/60 shadow-sm shadow-sky-500/20";
        }
        if (d.includes("fillers")) {
          return "bg-gradient-to-r from-yellow-500/30 to-lime-500/30 text-yellow-300 border-yellow-400/60 shadow-sm shadow-yellow-500/20";
        }
        return "bg-gradient-to-r from-purple-500/30 to-pink-500/30 text-purple-200 border-purple-400/50";
      };

      return (
        <div>
          {/* PRINT-ONLY VIEW: CLEAN PROFESSIONAL BLACK & WHITE */}
          <div className="hidden print-only">
            <div className="print-header">
              <h1>{data.title}</h1>
              <p style={{ fontSize: "12pt", fontStyle: "italic", marginTop: "3pt" }}>{data.sub}</p>
            </div>

            <div className="print-meta-grid">
              <div><strong>DATE & TIME:</strong> {data.when}</div>
              <div><strong>VENUE:</strong> {data.venue}</div>
            </div>

            <div className="print-section-title">Official Run of Show & Performance Itinerary</div>

            <table className="print-table">
              <thead>
                <tr>
                  <th style={{ width: "6%" }}>#</th>
                  <th style={{ width: "18%" }}>Category</th>
                  <th style={{ width: "44%" }}>Act / Segment Title</th>
                  <th style={{ width: "22%" }}>Performers / Anchors</th>
                  <th style={{ width: "10%", textAlign: "right" }}>Duration</th>
                </tr>
              </thead>
              <tbody>
                {data.rows.map((row, idx) => (
                  <tr key={idx}>
                    <td style={{ fontWeight: "bold" }}>{idx + 1}</td>
                    <td style={{ fontSize: "8.5pt", textTransform: "uppercase" }}>{TYPES_MAP[row.type] || row.type}</td>
                    <td><strong>{row.title}</strong></td>
                    <td style={{ fontStyle: "italic" }}>{row.who || "—"}</td>
                    <td style={{ textAlign: "right", fontWeight: "bold" }}>{row.min || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>

            <div className="print-section-title">Department-wise Organizing Committee & Roles</div>

            {allDepartments.map((dept, dIdx) => {
              const deptMembers = members.filter(m => m.department === dept);
              if (deptMembers.length === 0) return null;

              return (
                <div key={dIdx} style={{ marginBottom: "8pt", pageBreakInside: "avoid" }}>
                  <div style={{ fontSize: "10pt", fontWeight: "bold", background: "#f0f0f0", padding: "2pt 4pt", border: "0.5pt solid #888" }}>
                    {dept}
                  </div>
                  <table className="print-table" style={{ marginBottom: "4pt" }}>
                    <thead>
                      <tr>
                        <th style={{ width: "8%" }}>S.No</th>
                        <th style={{ width: "42%" }}>Name</th>
                        <th style={{ width: "25%" }}>Role / Category</th>
                        <th style={{ width: "25%", textAlign: "right" }}>Roll Number</th>
                      </tr>
                    </thead>
                    <tbody>
                      {deptMembers.map((m, mIdx) => (
                        <tr key={m.id || mIdx}>
                          <td>{mIdx + 1}</td>
                          <td><strong>{m.name}</strong></td>
                          <td>{m.role}</td>
                          <td style={{ textAlign: "right", fontFamily: "monospace" }}>{m.rollNo}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              );
            })}

            <div className="print-footer">
              <p><strong>{data.contact}</strong></p>
              <p style={{ fontSize: "8pt", color: "#555", marginTop: "2pt" }}>
                Printed on {new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })} • Freshers 2026 Organizing Committee
              </p>
            </div>
          </div>

          {/* WEB INTERFACE: HIGH-CONTRAST DARK THEME */}
          <div className="noprint min-h-screen flex flex-col relative overflow-x-hidden">
            
            {/* Interactive 3D WebGL Background Scene */}
            <ThreeDBackground />
            
            {/* Toast Notification */}
            {toastMsg && (
              <div className="fixed bottom-6 right-6 z-50 glass-card px-6 py-3.5 rounded-2xl border-2 border-purple-400/80 bg-[#0e0720]/95 text-white shadow-[0_10px_35px_rgba(168,85,247,0.35)] flex items-center gap-3 transition-all duration-300">
                <span className="text-2xl">✨</span>
                <span className="text-sm font-bold tracking-wide">{toastMsg}</span>
              </div>
            )}

            {/* Navigation Bar */}
            <header className="sticky top-0 z-40 glass-nav px-3 sm:px-6 py-2.5 sm:py-3.5 shadow-xl">
              <div className="max-w-7xl mx-auto flex items-center justify-between gap-2 sm:gap-4">
                
                {/* Logo & Title */}
                <div className="flex items-center gap-2.5 sm:gap-3 cursor-pointer select-none min-w-0" onClick={() => setActiveTab("home")}>
                  <div className="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-purple-600/20 border border-purple-400/30 flex items-center justify-center text-lg sm:text-xl shadow-inner shrink-0">
                    ✨
                  </div>
                  <div className="min-w-0">
                    <div className="font-heading font-black text-lg sm:text-xl tracking-tight text-white flex items-center gap-1.5 leading-tight">
                      <span>Freshers</span>
                      <span className="text-amber-300 font-extrabold text-xs px-1.5 py-0.5 rounded-md bg-amber-400/10 border border-amber-400/20">2026</span>
                    </div>
                    <div className="text-[10px] sm:text-[11px] font-semibold text-slate-400 tracking-wide truncate">
                      Thursday, Oct 16 • 10:00 AM
                    </div>
                  </div>
                </div>

                {/* Desktop Nav Tabs */}
                <nav className={(viewMode === "phone" ? "hidden" : "hidden md:flex") + " items-center gap-1 bg-white/[0.04] p-1 rounded-xl border border-white/10"}>
                  <button 
                    onClick={() => setActiveTab("home")} 
                    className={"px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all " + (activeTab === "home" ? "bg-white text-gray-950 font-bold shadow-sm" : "text-slate-300 hover:text-white hover:bg-white/5")}>
                    Overview
                  </button>
                  <button 
                    onClick={() => setActiveTab("schedule")} 
                    className={"px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all " + (activeTab === "schedule" ? "bg-white text-gray-950 font-bold shadow-sm" : "text-slate-300 hover:text-white hover:bg-white/5")}>
                    Itinerary & Acts
                  </button>
                  <button 
                    onClick={() => setActiveTab("members")} 
                    className={"px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 " + (activeTab === "members" ? "bg-white text-gray-950 font-bold shadow-sm" : "text-slate-300 hover:text-white hover:bg-white/5")}>
                    <span>👥</span> Committee
                  </button>
                  <button 
                    onClick={() => setActiveTab("team")} 
                    className={"px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all " + (activeTab === "team" ? "bg-white text-gray-950 font-bold shadow-sm" : "text-slate-300 hover:text-white hover:bg-white/5")}>
                    Anchor Squad
                  </button>
                  {isSuperAdmin && (
                    <button 
                      onClick={() => setActiveTab("admin")} 
                      className={"px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 " + (activeTab === "admin" ? "bg-amber-400 text-gray-950 shadow-sm" : "text-amber-300 hover:bg-amber-400/10")}>
                      <span>👑</span> Admin
                    </button>
                  )}

                          value={insertPosition} 
                          onChange={e => setInsertPosition(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white focus:outline-none font-bold text-sm bg-gray-950">
                          <option value="bottom" className="bg-gray-950 text-white">At Bottom (End)</option>
                          <option value="top" className="bg-gray-950 text-white">At Top (Beginning)</option>
                        </select>
                      </div>
                    </div>

                    <div className="pt-2 flex gap-3">
                      <button 
                        type="button" 
                        onClick={() => setIsAddingRow(false)}
                        className="w-1/2 py-3.5 rounded-2xl glass-card hover:bg-white/10 text-white font-bold text-sm border border-purple-500/30">
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-sm shadow-xl shadow-purple-600/30 transition-all">
                        Save Row
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: ADD COMMITTEE MEMBER */}
            {isAddingMember && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-card max-w-lg w-full p-7 rounded-3xl relative border-2 border-purple-400 shadow-2xl space-y-5">
                  <button 
                    onClick={() => setIsAddingMember(false)} 
                    className="absolute top-5 right-5 text-gray-400 hover:text-white text-lg p-2">
                    ✕
                  </button>

                  <div className="space-y-1">
                    <h3 className="font-heading text-2xl font-black text-white flex items-center gap-2">
                      <span>👥</span> Add Organizing Member
                    </h3>
                    <p className="text-xs text-purple-200">
                      Add a student member to an organizing department roster.
                    </p>
                  </div>

                  <form onSubmit={handleCreateMember} className="space-y-4 text-left">
                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Department</label>
                      <select 
                        value={newMemberDept} 
                        onChange={e => setNewMemberDept(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white focus:outline-none font-bold text-sm bg-gray-950">
                        {allDepartments.map((dept, dIdx) => (
                          <option key={dIdx} value={dept} className="bg-gray-950 text-white">{dept}</option>
                        ))}
                        <option value="__custom__" className="bg-gray-950 text-amber-300">+ Create New Department...</option>
                      </select>
                    </div>

                    {newMemberDept === "__custom__" && (
                      <div>
                        <label className="block text-xs font-black uppercase text-amber-300 mb-1">New Department Name</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="e.g. Discipline & Stage Security"
                          value={newMemberCustomDept}
                          onInput={e => setNewMemberCustomDept(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-amber-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Student Full Name</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Parth Gupta"
                        value={newMemberName}
                        onInput={e => setNewMemberName(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Role / Category</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="e.g. Member / Lead / Anchor"
                          value={newMemberRole}
                          onInput={e => setNewMemberRole(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Roll Number</label>
                        <input 
                          type="text" 
                          placeholder="e.g. 2500460120007"
                          value={newMemberRoll}
                          onInput={e => setNewMemberRoll(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium font-mono"
                        />
                      </div>
                    </div>

                    <div className="pt-2 flex gap-3">
                      <button 
                        type="button" 
                        onClick={() => setIsAddingMember(false)}
                        className="w-1/2 py-3.5 rounded-2xl glass-card hover:bg-white/10 text-white font-bold text-sm border border-purple-500/30">
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm shadow-xl shadow-emerald-600/30 transition-all">
                        Save Member
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: AUTHENTICATION (SIGNUP & LOGIN WITH AUTO-LOGIN) */}
            {authModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-card max-w-md w-full p-8 rounded-3xl relative border-2 border-purple-400 shadow-2xl space-y-6">
                  
                  <button 
                    onClick={() => setAuthModalOpen(false)} 
                    className="absolute top-5 right-5 text-gray-400 hover:text-white p-2 text-lg">
                    ✕
                  </button>

                  <div className="text-center space-y-2">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-2xl mx-auto shadow-lg shadow-purple-500/30 border border-purple-300/40">
                      🎉
                    </div>
                    <h3 className="font-heading text-3xl font-black text-white">
                      {isSignup ? "Create Portal Account" : "Log In to Freshers 2026"}
                    </h3>
                    <p className="text-xs text-purple-200">
                      {isSignup ? "Sign up to join the party and view official itineraries." : "Welcome back! Enter your email and password."}
                    </p>
                  </div>

                  <form onSubmit={handleAuth} className="space-y-4">
                    {isSignup && (
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Full Name</label>
                        <input 
                          type="text" 
                          required 
                          value={authName}
                          onInput={e => setAuthName(e.target.value)}
                          placeholder="e.g. Parth Gupta"
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        value={authEmail}
                        onInput={e => setAuthEmail(e.target.value)}
                        placeholder="e.g. devanshpandeyofficial6@gmail.com"
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Password</label>
                      <input 
                        type="password" 
                        required 
                        value={authPass}
                        onInput={e => setAuthPass(e.target.value)}
                        placeholder="••••••••"
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    {authError && (
                      <div className="p-3.5 rounded-2xl bg-red-950/80 border-2 border-red-500 text-red-200 text-xs font-bold">
                        {authError}
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-sm shadow-xl shadow-purple-600/40 transition-all">
                      {isSignup ? "Create Account & Join (Instant Login)" : "Log In"}
                    </button>
                  </form>

                  <div className="text-center text-xs text-purple-200 border-t border-purple-500/20 pt-4 font-semibold">
                    <span>{isSignup ? "Already have an account?" : "Don't have an account yet?"}</span>
                    <button 
                      onClick={() => { setIsSignup(!isSignup); setAuthError(""); }}
                      className="text-pink-400 hover:text-pink-300 font-black ml-1.5 underline">
                      {isSignup ? "Log In here" : "Sign Up here"}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
