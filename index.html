    function Ed({ v, on, cls = "", ph = "Type here...", label, set }) {
      const r = useRef();
      useLayoutEffect(() => {
        const el = r.current;
        if (el && document.activeElement !== el) el.textContent = v || "";
      }, [v]);

      return (
        <span
          ref={r}
          contentEditable={on}
          suppressContentEditableWarning={true}
          data-ph={ph}
          className={cls + (on ? " edt" : "")}
          onBlur={e => {
            const text = e.currentTarget.textContent.trim();
            if (text !== v) set(text, label, v);
          }}
          onKeyDown={e => {
            if (e.key === "Enter") {
              e.preventDefault();
              e.currentTarget.blur();
            }
          }}
        />
      );
    }

        if (isSignup) {
          if (updatedUsers.some(u => u.email.toLowerCase() === email)) {
            setAuthError("An account with this email already exists. Please log in.");
            return;
          }

          const newUser = {
            id: "user-" + Date.now(),
            email: email,
            name: authName.trim() || email.split("@")[0],
            password: pass,
            role: email === ADMIN_EMAIL.toLowerCase() ? "admin" : "viewer",
            canEdit: email === ADMIN_EMAIL.toLowerCase(),
            registeredAt: new Date().toISOString()

          updatedUsers.push(newUser);
          setUsers(updatedUsers);
          localStorage.setItem("fresher_party_users", JSON.stringify(updatedUsers));

          setCurrentUser(newUser);
          localStorage.setItem("fresher_active_session", JSON.stringify(newUser));
          setAuthModalOpen(false);
          notify(`🎉 Welcome ${newUser.name}! Your account has been registered.`);

            return;

                                      Remove
                                    </button>
                                  ) : <span className="text-xs text-gray-500">—</span>}
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}
            </main>

            {/* Footer */}
            <footer className="border-t border-purple-500/20 py-8 px-4 text-center text-xs text-purple-200 mt-auto bg-black/40">
              <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 font-medium">
                <div>
                  © 2026 Freshers Welcome • October 16, 2026 • 10:00 AM
                </div>
                <div className="text-gray-300">
                  Management Lead: <strong className="text-white">Devansh Pandey</strong>
                </div>
              </div>
            </footer>

            {/* MODAL: ADD NEW PERFORMANCE / ROW */}
            {isAddingRow && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-card max-w-lg w-full p-7 rounded-3xl relative border-2 border-purple-400 shadow-2xl space-y-5">
                  <button 
                    onClick={() => setIsAddingRow(false)} 
                    className="absolute top-5 right-5 text-gray-400 hover:text-white text-lg p-2">
                    ✕
                  </button>

                  <div className="space-y-1">
                    <h3 className="font-heading text-2xl font-black text-white flex items-center gap-2">
                      <span>➕</span> Add Performance / Slot
                    </h3>
                    <p className="text-xs text-purple-200">
                      Add a new solo song, dance act, skit, ramp round, open slot, or anchor link.
                    </p>
                  </div>

                  <form onSubmit={handleCreateRow} className="space-y-4 text-left">
                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Category / Type</label>
                      <select 
                        value={newRowType} 
                        onChange={e => setNewRowType(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white focus:outline-none font-bold text-sm bg-gray-950">
                        {ROW_CATEGORIES.map(cat => <option key={cat.id} value={cat.id} className="bg-gray-950 text-white">{cat.label}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Title / Segment Name</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Solo Singing / Ramp Round / Open Slot"
                        value={newRowTitle}
                        onInput={e => setNewRowTitle(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Performer(s) / Batch / Anchors</label>
                      <input 
                        type="text" 
                        placeholder="e.g. Tanishq / Freshers Batch"
                        value={newRowWho}
                        onInput={e => setNewRowWho(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Duration (Optional)</label>
                        <input 
                          type="text" 
                          placeholder="e.g. 3 MIN"
                          value={newRowMin}
                          onInput={e => setNewRowMin(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Insert Position</label>
                        <select 
                          value={insertPosition} 
                          onChange={e => setInsertPosition(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white focus:outline-none font-bold text-sm bg-gray-950">
                          <option value="bottom" className="bg-gray-950 text-white">At the end (Bottom)</option>
                          <option value="top" className="bg-gray-950 text-white">At the start (Top)</option>
                        </select>
                      </div>
                    </div>

                    <div className="pt-2 flex gap-3">
                      <button 
                        type="button" 
                        onClick={() => setIsAddingRow(false)}
                        className="w-1/2 py-3.5 rounded-2xl glass-card hover:bg-white/10 text-white font-bold text-sm border border-purple-500/30">
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm shadow-xl shadow-emerald-600/30 transition-all">
                        Add to Itinerary
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: ADD COMMITTEE MEMBER */}
            {isAddingMember && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-card max-w-lg w-full p-7 rounded-3xl relative border-2 border-purple-400 shadow-2xl space-y-5">
                  <button 
                    onClick={() => setIsAddingMember(false)} 
                    className="absolute top-5 right-5 text-gray-400 hover:text-white text-lg p-2">
                    ✕
                  </button>

                  <div className="space-y-1">
                    <h3 className="font-heading text-2xl font-black text-white flex items-center gap-2">
                      <span>👤</span> Add Committee Member
                    </h3>
                    <p className="text-xs text-purple-200">
                      Add a student member to an organizing department with their role and roll number.
                    </p>
                  </div>

                  <form onSubmit={handleCreateMember} className="space-y-4 text-left">
                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Department</label>
                      <select 
                        value={newMemberDept} 
                        onChange={e => setNewMemberDept(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white focus:outline-none font-bold text-sm bg-gray-950">
                        {allDepartments.map((dept, dIdx) => (
                          <option key={dIdx} value={dept} className="bg-gray-950 text-white">{dept}</option>
                        ))}
                        <option value="__custom__" className="bg-gray-950 text-amber-300">+ Create New Department...</option>
                      </select>
                    </div>

                    {newMemberDept === "__custom__" && (
                      <div>
                        <label className="block text-xs font-black uppercase text-amber-300 mb-1">New Department Name</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="e.g. Discipline & Stage Security"
                          value={newMemberCustomDept}
                          onInput={e => setNewMemberCustomDept(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-amber-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Student Full Name</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="e.g. Parth Gupta"
                        value={newMemberName}
                        onInput={e => setNewMemberName(e.target.value)}
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Role / Category</label>
                        <input 
                          type="text" 
                          required 
                          placeholder="e.g. Member / Lead / Anchor"
                          value={newMemberRole}
                          onInput={e => setNewMemberRole(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Roll Number</label>
                        <input 
                          type="text" 
                          placeholder="e.g. 2500460120007"
                          value={newMemberRoll}
                          onInput={e => setNewMemberRoll(e.target.value)}
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium font-mono"
                        />
                      </div>
                    </div>

                    <div className="pt-2 flex gap-3">
                      <button 
                        type="button" 
                        onClick={() => setIsAddingMember(false)}
                        className="w-1/2 py-3.5 rounded-2xl glass-card hover:bg-white/10 text-white font-bold text-sm border border-purple-500/30">
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="w-1/2 py-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-black text-sm shadow-xl shadow-emerald-600/30 transition-all">
                        Save Member
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: AUTHENTICATION */}
            {authModalOpen && (
              <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                <div className="glass-card max-w-md w-full p-8 rounded-3xl relative border-2 border-purple-400 shadow-2xl space-y-6">
                  
                  <button 
                    onClick={() => setAuthModalOpen(false)} 
                    className="absolute top-5 right-5 text-gray-400 hover:text-white p-2 text-lg">
                    ✕
                  </button>

                  <div className="text-center space-y-2">
                    <div className="w-12 h-12 rounded-2xl bg-gradient-to-tr from-purple-600 to-pink-500 flex items-center justify-center text-2xl mx-auto shadow-lg shadow-purple-500/30 border border-purple-300/40">
                      🎉
                    </div>
                    <h3 className="font-heading text-3xl font-black text-white">
                      {isSignup ? "Create Portal Account" : "Log In to Freshers 2026"}
                    </h3>
                    <p className="text-xs text-purple-200">
                      {isSignup ? "Sign up to join the party and view official itineraries." : "Welcome back! Enter your email and password."}
                    </p>
                  </div>

                  <form onSubmit={handleAuth} className="space-y-4">
                    {isSignup && (
                      <div>
                        <label className="block text-xs font-black uppercase text-purple-200 mb-1">Full Name</label>
                        <input 
                          type="text" 
                          required 
                          value={authName}
                          onInput={e => setAuthName(e.target.value)}
                          placeholder="e.g. Devansh Pandey"
                          className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                        />
                      </div>
                    )}

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Email Address</label>
                      <input 
                        type="email" 
                        required 
                        value={authEmail}
                        onInput={e => setAuthEmail(e.target.value)}
                        placeholder="e.g. devanshpandeyofficial6@gmail.com"
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-black uppercase text-purple-200 mb-1">Password</label>
                      <input 
                        type="password" 
                        required 
                        value={authPass}
                        onInput={e => setAuthPass(e.target.value)}
                        placeholder="••••••••"
                        className="w-full px-4 py-3 rounded-2xl glass-card border border-purple-400 text-white placeholder-gray-500 focus:outline-none text-sm font-medium"
                      />
                    </div>

                    {authError && (
                      <div className="p-3.5 rounded-2xl bg-red-950/80 border-2 border-red-500 text-red-200 text-xs font-bold">
                        {authError}
                      </div>
                    )}

                    <button 
                      type="submit" 
                      className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-black text-sm shadow-xl shadow-purple-600/40 transition-all">
                      {isSignup ? "Create Account & Join" : "Log In"}
                    </button>
                  </form>

                  <div className="text-center text-xs text-purple-200 border-t border-purple-500/20 pt-4 font-semibold">
                    <span>{isSignup ? "Already have an account?" : "Don't have an account yet?"}</span>
                    <button 
                      onClick={() => { setIsSignup(!isSignup); setAuthError(""); }}
                      className="text-pink-400 hover:text-pink-300 font-black ml-1.5 underline">
                      {isSignup ? "Log In here" : "Sign Up here"}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
